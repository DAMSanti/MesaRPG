# MesaRPG - Docker Compose para servidor compartido (Oracle Cloud + Sprinta)
#
# A diferencia de docker-compose.prod.yml / docker-compose.simple.yml, este NO
# trae nginx ni certbot propios: los puertos 80/443 del host ya los ocupa el
# nginx de otro proyecto (Sprinta) corriendo en el mismo servidor. Este archivo
# solo levanta la app MesaRPG, sin publicar su puerto al host, conectada a la
# red externa "edge" para que ese nginx pueda alcanzarla por nombre de
# contenedor ("mesarpg:8000"). Ver docs/DEPLOY.md, sección "Servidor
# compartido con Sprinta".
#
# Uso: docker compose -f docker-compose.oracle.yml up -d --build

services:
  mesarpg:
    build: ..
    container_name: mesarpg
    volumes:
      - ../config:/app/config:ro
      - mesarpg-data:/app/data
      - ../assets:/app/assets
    env_file:
      - ../.env
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/state"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - edge

networks:
  # Creada una vez en el servidor con: docker network create edge
  # Compartida con el nginx del otro proyecto (ver
  # D:\Portfolio\sprinta\docker-compose.prod.yml, servicio "web").
  edge:
    external: true

volumes:
  mesarpg-data:
