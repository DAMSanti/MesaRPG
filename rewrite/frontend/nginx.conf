# Servido estático del build de Vite dentro del contenedor. No confundir con el nginx del
# servidor compartido (sprinta-web, ~/sprinta/deploy/nginx.conf en el servidor) — ese es el
# que recibe el tráfico público de rpgvision.duckdns.org y hace proxy_pass hacia este
# contenedor (y hacia el del backend) por su nombre en la red Docker "edge".
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
